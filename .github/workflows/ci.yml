name: TUKO checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
        env:
          DJANGO_SECRET_KEY: ci-only-insecure-not-for-production
      - run: python manage.py test
        env:
          DJANGO_SECRET_KEY: ci-only-insecure-not-for-production
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: ci-only-insecure-not-for-production

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tuko-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tuko-frontend/package-lock.json
      - run: npm ci
      - run: CI=true npm test -- --watch=false --runInBand
      - run: CI=false npm run build


  bootstrap-migrations:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/marketplace-mvp-hardening-20261015'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/marketplace-mvp-hardening-20261015
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - name: Generate initial Django migrations
        working-directory: backend
        run: python manage.py makemigrations --noinput accounts vendors catalog orders payments delivery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align React Router with CRA Jest compatibility
        working-directory: tuko-frontend
        run: npm install react-router-dom@6.30.1 --save --package-lock-only
      - name: Commit generated project baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/accounts/migrations backend/vendors/migrations backend/catalog/migrations backend/orders/migrations backend/payments/migrations backend/delivery/migrations tuko-frontend/package.json tuko-frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: commit initial migrations and router compatibility lock"
            git fetch origin feature/marketplace-mvp-hardening-20261015
            git rebase origin/feature/marketplace-mvp-hardening-20261015
            git push origin HEAD:feature/marketplace-mvp-hardening-20261015
          fi
